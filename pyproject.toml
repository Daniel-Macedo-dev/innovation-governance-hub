[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "innovation-governance-hub"
version = "0.1.0"
description = "MVP local de governança de inovação e IA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "httpx>=0.27,<1", "openpyxl>=3.1,<4",
  "pandas>=2.2,<3", "plotly>=5.24,<7", "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3", "sqlalchemy>=2.0,<3",
  "streamlit>=1.40,<2", "uvicorn>=0.30,<1", "google-genai>=1.0,<2"
]

[project.optional-dependencies]
dev = ["mypy>=1.13,<2", "pytest>=8.3,<9", "pytest-cov>=6,<8", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["pages/"]
